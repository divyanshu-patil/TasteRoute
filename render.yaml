# Render blueprint for the API (docs/16-runbook.md). One instance: rate limiters live in-process.
# The web app deploys on Vercel with root directory apps/web and NEXT_PUBLIC_API_URL set to this service's URL.
services:
  - type: web
    name: tasteroute-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn tasteroute_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.8 }
      - { key: APP_ENV, value: production }
      - { key: QLOO_BASE_URL, value: https://hackathon.api.qloo.com }
      - { key: LLM_PROVIDER, value: ollama_cloud }
      - { key: OLLAMA_BASE_URL, value: https://ollama.com }
      - { key: OLLAMA_MODEL, value: gemma4:31b }
      - { key: DEMO_MODE_ENABLED, value: "true" }
      - { key: SESSION_SECRET, generateValue: true }
      # Entered in the Render dashboard, never committed:
      - { key: DATABASE_URL, sync: false }
      - { key: QLOO_API_KEY, sync: false }
      - { key: OLLAMA_API_KEY, sync: false }
      - { key: HUNTER_API_KEY, sync: false }
      - { key: CORS_ORIGINS, sync: false }
      - { key: OSM_USER_AGENT, sync: false }
      - { key: DEMO_RUN_ID, sync: false }
