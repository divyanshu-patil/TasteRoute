name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: tasteroute_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tasteroute_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run python scripts/migrate.py --url "$TEST_DATABASE_URL"
        working-directory: apps/api
      - name: Contracts match the API (API-01)
        run: |
          (cd apps/api && uv run python scripts/export_openapi.py)
          pnpm --filter ./packages/contracts generate
          git diff --exit-code packages/contracts
      # No live Qloo, LLM or OSM calls: tests use recorded fixtures and block the network.
      - run: pnpm turbo lint check-types test build
